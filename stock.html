<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('stockanalyzer.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #2c3e50;
            /* force dropdown to open below */
            position: relative;
        }

        select option {
            background: #fff;
            color: #2c3e50;
        }

        .evaluate-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .evaluate-btn:hover {
            background-color: #3498db;
            transform: scale(1.05);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #2c3e50;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Stock Dashboard</h1>
        <label for="stock-select">Select Stock ID:</label><br>
        <select id="stock-select" size="1">
            <option value="" disabled selected>-- Select Stock --</option>
            <script>
                for (let i = 1; i <= 100; i++) {
                    const id = 'STK' + i.toString().padStart(3, '0');
                    document.write(`<option value="${id}">${id}</option>`);
                }
            </script>
        </select>

        <div id="status">Analysis Status: <span id="analysis-status">Unevaluated</span></div>

        <button class="evaluate-btn" onclick="evaluateStock()">Evaluate</button>
    </div>

    <script>
        function evaluateStock() {
            const select = document.getElementById('stock-select');
            if (!select.value) {
                alert('Please select a stock ID first!');
                return;
            }
            const stockId = select.value;
            window.location.href = `evaluate.html?stock=${stockId}`;
        }
    </script>

</body>

</html>
