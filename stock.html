<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            /* Full-page background image */
            background-image: url('stock.png');
            /* Replace with your image URL */
            background-size: cover;
            /* Cover entire page */
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            /* Stay fixed when scrolling */
        }

        .container {
            width: 95%;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            /* Semi-transparent to see background */
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #2c3e50;
        }

        .evaluate-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .evaluate-btn:hover {
            background-color: #3498db;
            transform: scale(1.05);
        }

        .portfolio-btn {
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 30px;
        }

        .portfolio-btn:hover {
            background-color: #c0392b;
            transform: scale(1.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #2c3e50;
        }
    </style>
</head>

<body>

    <h1>Stock Dashboard</h1>

    <div class="container">
        <label for="stock-select">Select Stock ID:</label><br>
        <select id="stock-select">
            <option value="" disabled selected>-- Select Stock --</option>
            <script>
                for (let i = 1; i <= 100; i++) {
                    const id = 'STK' + i.toString().padStart(3, '0');
                    document.write(`<option value="${id}">${id}</option>`);
                }
            </script>
        </select>

        <div id="status">Analysis Status: <span id="analysis-status">Unevaluated</span></div>

        <button class="evaluate-btn" onclick="evaluateStock()">Evaluate</button>

        <div>
            <button class="portfolio-btn" onclick="portfolioAnalyzer()">Portfolio Analyzer</button>
        </div>
    </div>

    <script>
        function evaluateStock() {
            const select = document.getElementById('stock-select');
            const status = document.getElementById('analysis-status');
            if (!select.value) {
                alert('Please select a stock first!');
                return;
            }
            status.textContent = 'Evaluated';
            alert(`${select.value} has been evaluated!`);
        }

        function portfolioAnalyzer() {
            alert('Portfolio Analyzer clicked!');
        }
    </script>

</body>

</html>
