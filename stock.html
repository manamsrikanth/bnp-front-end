<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gen Market Evaluation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body,
        html {
            height: 100%;
        }

        body {
            background-image: url('stock.png');
            /* Replace with your image URL */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 30px 30px 30px;
            color: white;
        }

        header .logo {
            position: absolute;
            left: 20px;
            top: 5;
            height: 100px;
            /* Logo size */
            width: auto;
        }

        header h1 {
            font-size: 2rem;
            text-align: center;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .dashboard {
            width: 95%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.3);
            /* semi-transparent */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            /* blur effect */
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #2c3e50;
        }

        .evaluate-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .evaluate-btn:hover {
            background-color: #3498db;
            transform: scale(1.05);
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        footer {
            text-align: center;
            padding: 15px 0;
            color: white;
            font-size: 1.3rem;
        }
    </style>
</head>

<body>

    <header>
        <img src="bnp logo.png" alt="Company Logo" class="logo">
        <h1>Next Gen Market Evaluation</h1>
    </header>

    <div class="container">
        <div class="dashboard">
            <label for="stock-select">Select Stock ID:</label><br>
            <select id="stock-select" size="1">
                <option value="" disabled selected>-- Select Stock --</option>
                <script>
                    for (let i = 1; i <= 100; i++) {
                        const id = 'STK' + i.toString().padStart(3, '0');
                        document.write(`<option value="${id}">${id}</option>`);
                    }
                </script>
            </select>

            <div id="status">Analysis Status: <span id="analysis-status">Unevaluated</span></div>

            <button class="evaluate-btn" onclick="evaluateStock()">Evaluate</button>
        </div>
    </div>

    <footer>
        &copy; 2025 Next Gen Market Evaluation. All rights reserved.
    </footer>

    <script>
        function evaluateStock() {
            const select = document.getElementById('stock-select');
            if (!select.value) {
                alert('Please select a stock ID first!');
                return;
            }
            const stockId = select.value;
            window.location.href = `evaluate.html?stock=${stockId}`;
        }
    </script>

</body>

</html>
