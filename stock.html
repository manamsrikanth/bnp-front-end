<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('stock.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            /* more transparent */
            backdrop-filter: blur(12px);
            /* blur for glass effect */
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgb(255, 255, 255);
            /* subtle border */
        }

        select {
            padding: 10px 15px;
            font-size: 1rem;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.3);
            color: #2c3e50;
        }

        select option {
            background: #e0e0e0;
            color: #2c3e50;
        }

        .evaluate-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: rgba(41, 128, 185, 0.85);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .evaluate-btn:hover {
            background-color: rgba(52, 152, 219, 0.95);
            transform: scale(1.05);
        }

        h1 {
            text-align: center;
            color: #fff;
            /* white to contrast with bg */
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.6);
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Stock Dashboard</h1>
        <label for="stock-select" style="color: #ffffff;">Select Stock ID:</label><br>
        <select id="stock-select" size="1">
            <option value="" disabled selected>-- Select Stock --</option>
            <script>
                for (let i = 1; i <= 100; i++) {
                    const id = 'STK' + i.toString().padStart(3, '0');
                    document.write(`<option value="${id}">${id}</option>`);
                }
            </script>
        </select>

        <div id="status">Analysis Status: <span id="analysis-status">Unevaluated</span></div>

        <button class="evaluate-btn" onclick="evaluateStock()">Evaluate</button>
    </div>

    <script>
        function evaluateStock() {
            const select = document.getElementById('stock-select');
            if (!select.value) {
                alert('Please select a stock ID first!');
                return;
            }
            const stockId = select.value;
            window.location.href = `evaluate.html?stock=${stockId}`;
        }
    </script>

</body>

</html>
