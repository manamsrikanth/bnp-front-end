<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            /* Center horizontally */
            align-items: center;
            /* Center vertically */
            background: url("stock.png") no-repeat center center/cover;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background: rgba(28, 235, 107, 0.85);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(254, 254, 254, 0.3);
            text-decoration: none;
        }

        .btn:hover {
            background: rgba(52, 152, 219, 0.9);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <!-- Option 1: Using a link -->
    <a href="stock.html" class="btn">Stocks</a>

</body>

</html>
